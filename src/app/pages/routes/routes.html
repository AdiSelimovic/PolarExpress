<div class="routes">
  <div class="container">
    <h1 class="page-title">Route Map</h1>
    <p class="page-subtitle">All routes converge in Winnipeg before continuing north to Churchill, Manitoba</p>

    <!-- Route Visualization -->
    <div class="route-map-container">
      <svg class="route-map" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
        <!-- Define gradients for the route lines -->
        <defs>
          <linearGradient id="routeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3" />
            <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
          </linearGradient>

          <!-- Glow effect -->
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Background Map - USA and Canada -->
        <g class="background-map" opacity="0.15">
          <!-- Simplified USA outline -->
          <path d="M 850 600 L 900 580 L 920 570 L 930 550 L 930 530 L 920 510 L 900 500 L 880 500 L 860 490 L 840 480 L 820 470 L 800 470 L 780 470 L 760 460 L 740 450 L 720 440 L 700 430 L 680 430 L 660 430 L 640 440 L 620 450 L 600 460 L 580 470 L 560 480 L 540 490 L 520 500 L 500 510 L 480 520 L 460 530 L 440 530 L 420 520 L 400 510 L 380 500 L 360 490 L 340 480 L 320 470 L 300 470 L 280 480 L 260 490 L 240 500 L 220 510 L 200 520 L 180 530 L 160 540 L 150 550 L 140 570 L 130 590 L 130 610 L 140 630 L 150 640 L 170 650 L 190 650 L 210 650 L 230 660 L 250 670 L 270 680 L 290 690 L 310 700 L 330 710 L 350 710 L 370 710 L 390 710 L 410 700 L 430 690 L 450 680 L 470 680 L 490 680 L 510 680 L 530 680 L 550 680 L 570 680 L 590 670 L 610 660 L 630 650 L 650 640 L 670 630 L 690 620 L 710 610 L 730 600 L 750 600 L 770 600 L 790 600 L 810 600 L 830 600 L 850 600 Z"
                fill="none"
                stroke="rgba(255, 255, 255, 0.3)"
                stroke-width="1.5" />

          <!-- Canada outline -->
          <path d="M 150 550 L 170 540 L 190 530 L 210 520 L 230 510 L 250 500 L 270 490 L 290 480 L 310 470 L 330 460 L 350 450 L 370 440 L 390 430 L 410 420 L 430 410 L 450 400 L 470 390 L 490 380 L 510 370 L 530 360 L 550 350 L 570 340 L 590 330 L 610 320 L 630 310 L 650 300 L 670 290 L 690 280 L 710 280 L 730 280 L 750 290 L 770 300 L 790 310 L 810 320 L 830 330 L 850 340 L 870 350 L 890 360 L 910 370 L 920 380 L 930 390 L 930 410 L 920 430 L 910 440 L 890 450 L 870 460 L 850 470 L 830 470 L 810 470 L 790 470 L 770 460 L 750 450 L 730 440 L 710 430 L 690 430 L 670 430 L 650 440 L 630 450 L 610 460 L 590 470 L 570 480 L 550 490 L 530 500 L 510 510 L 490 520 L 470 530 L 450 530 L 430 520 L 410 510 L 390 500 L 370 490 L 350 480 L 330 470 L 310 470 L 290 480 L 270 490 L 250 500 L 230 510 L 210 520 L 190 530 L 170 540 L 150 550 Z"
                fill="none"
                stroke="rgba(255, 255, 255, 0.3)"
                stroke-width="1.5" />

          <!-- Hudson Bay -->
          <ellipse cx="500" cy="200" rx="80" ry="120"
                   fill="none"
                   stroke="rgba(100, 150, 255, 0.4)"
                   stroke-width="1.5"
                   stroke-dasharray="4,4" />

          <!-- Great Lakes region -->
          <ellipse cx="680" cy="480" rx="60" ry="30"
                   fill="rgba(100, 150, 255, 0.15)"
                   stroke="rgba(100, 150, 255, 0.4)"
                   stroke-width="1" />
        </g>

        <!-- Routes from cities to Winnipeg -->
        <!-- New York to Winnipeg -->
        <line x1="750" y1="550" x2="500" y2="350" stroke="url(#routeGradient)" stroke-width="2" class="route-line" />

        <!-- Chicago to Winnipeg -->
        <line x1="650" y1="500" x2="500" y2="350" stroke="url(#routeGradient)" stroke-width="2" class="route-line" />

        <!-- Boston to Winnipeg -->
        <line x1="850" y1="500" x2="500" y2="350" stroke="url(#routeGradient)" stroke-width="2" class="route-line" />

        <!-- Toronto to Winnipeg -->
        <line x1="700" y1="450" x2="500" y2="350" stroke="url(#routeGradient)" stroke-width="2" class="route-line" />

        <!-- Montreal to Winnipeg -->
        <line x1="800" y1="450" x2="500" y2="350" stroke="url(#routeGradient)" stroke-width="2" class="route-line" />

        <!-- Seattle to Winnipeg -->
        <line x1="200" y1="450" x2="500" y2="350" stroke="url(#routeGradient)" stroke-width="2" class="route-line" />

        <!-- Winnipeg to Churchill (main route north) -->
        <line x1="500" y1="350" x2="500" y2="100" stroke="#FFD700" stroke-width="4" class="main-route" filter="url(#glow)" />

        <!-- City markers -->
        <!-- Departure Cities -->
        <g class="city-marker clickable" data-city="new-york" (click)="selectCity('new-york')">
          <circle cx="750" cy="550" r="10" fill="#4A90E2" stroke="#FFD700" stroke-width="2" />
          <text x="750" y="580" text-anchor="middle" class="city-label">New York City</text>
          <text x="750" y="595" text-anchor="middle" class="city-distance">2,100 mi</text>
        </g>

        <g class="city-marker clickable" data-city="chicago" (click)="selectCity('chicago')">
          <circle cx="650" cy="500" r="10" fill="#4A90E2" stroke="#FFD700" stroke-width="2" />
          <text x="650" y="530" text-anchor="middle" class="city-label">Chicago</text>
          <text x="650" y="545" text-anchor="middle" class="city-distance">1,200 mi</text>
        </g>

        <g class="city-marker clickable" data-city="boston" (click)="selectCity('boston')">
          <circle cx="850" cy="500" r="10" fill="#4A90E2" stroke="#FFD700" stroke-width="2" />
          <text x="850" y="530" text-anchor="middle" class="city-label">Boston</text>
          <text x="850" y="545" text-anchor="middle" class="city-distance">2,300 mi</text>
        </g>

        <g class="city-marker clickable" data-city="toronto" (click)="selectCity('toronto')">
          <circle cx="700" cy="450" r="10" fill="#4A90E2" stroke="#FFD700" stroke-width="2" />
          <text x="700" y="480" text-anchor="middle" class="city-label">Toronto</text>
          <text x="700" y="495" text-anchor="middle" class="city-distance">1,800 mi</text>
        </g>

        <g class="city-marker clickable" data-city="montreal" (click)="selectCity('montreal')">
          <circle cx="800" cy="450" r="10" fill="#4A90E2" stroke="#FFD700" stroke-width="2" />
          <text x="800" y="480" text-anchor="middle" class="city-label">Montreal</text>
          <text x="800" y="495" text-anchor="middle" class="city-distance">2,000 mi</text>
        </g>

        <g class="city-marker clickable" data-city="seattle" (click)="selectCity('seattle')">
          <circle cx="200" cy="450" r="10" fill="#4A90E2" stroke="#FFD700" stroke-width="2" />
          <text x="200" y="480" text-anchor="middle" class="city-label">Seattle</text>
          <text x="200" y="495" text-anchor="middle" class="city-distance">1,500 mi</text>
        </g>

        <!-- Winnipeg (convergence point) -->
        <g class="city-marker convergence">
          <circle cx="500" cy="350" r="15" fill="#E94E77" stroke="#FFD700" stroke-width="3" />
          <text x="500" y="390" text-anchor="middle" class="city-label convergence-label">Winnipeg</text>
          <text x="500" y="405" text-anchor="middle" class="city-sublabel">Convergence Point</text>
        </g>

        <!-- Churchill (final destination) -->
        <g class="city-marker destination">
          <circle cx="500" cy="100" r="18" fill="#2ECC71" stroke="#FFD700" stroke-width="3" filter="url(#glow)" />
          <circle cx="500" cy="100" r="12" fill="#FFD700" opacity="0.5" />
          <text x="500" y="70" text-anchor="middle" class="city-label destination-label">Churchill, Manitoba</text>
          <text x="500" y="85" text-anchor="middle" class="city-sublabel">Final Destination</text>
        </g>
      </svg>
    </div>

    <!-- Journey Flow -->
    <div class="journey-flow">
      <h2 class="section-title">Your Journey</h2>
      <div class="flow-steps">
        <div class="flow-step">
          <div class="step-number">1</div>
          <h3>Departure</h3>
          <p>Board the Polar Express at your chosen departure city</p>
        </div>
        <div class="flow-arrow">→</div>
        <div class="flow-step">
          <div class="step-number">2</div>
          <h3>Convergence</h3>
          <p>All trains meet in Winnipeg, Manitoba</p>
        </div>
        <div class="flow-arrow">→</div>
        <div class="flow-step">
          <div class="step-number">3</div>
          <h3>Destination</h3>
          <p>Journey north to Churchill, Manitoba</p>
        </div>
      </div>
    </div>
  </div>
</div>
