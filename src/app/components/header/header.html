<header class="header">
  <div class="container">
    <div class="logo">
      <svg class="train-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="6" width="16" height="12" rx="2" stroke="currentColor" stroke-width="2"/>
        <line x1="4" y1="10" x2="20" y2="10" stroke="currentColor" stroke-width="2"/>
        <rect x="7" y="7" width="4" height="2" fill="currentColor"/>
        <rect x="13" y="7" width="4" height="2" fill="currentColor"/>
        <circle cx="8" cy="18" r="1.5" fill="currentColor"/>
        <circle cx="16" cy="18" r="1.5" fill="currentColor"/>
      </svg>
      <span class="logo-text">THE POLAR EXPRESS</span>
    </div>
    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
      <a routerLink="/journey" routerLinkActive="active" class="nav-link">Journey</a>
      <a routerLink="/routes" routerLinkActive="active" class="nav-link">Routes</a>
      <a routerLink="/tracker" routerLinkActive="active" class="nav-link">Tracker</a>
      <a routerLink="/cart" routerLinkActive="active" class="nav-link cart-link">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 2L7 7H21L19 2H9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <rect x="6" y="7" width="16" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
          <circle cx="10" cy="21" r="1" fill="currentColor"/>
          <circle cx="18" cy="21" r="1" fill="currentColor"/>
        </svg>
        @if (cartService.totalItems() > 0) {
          <span class="cart-badge">{{ cartService.totalItems() }}</span>
        }
      </a>
      <a routerLink="/book-now" routerLinkActive="active" class="nav-link book-now-btn">Book Now</a>
    </nav>
  </div>
</header>
