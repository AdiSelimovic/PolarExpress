<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#2c1810"/>

  <!-- Warm glow -->
  <circle cx="200" cy="150" r="120" fill="#ff8c42" opacity="0.15"/>

  <!-- Santa figure -->
  <g transform="translate(200, 150)">
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="50" ry="60" fill="#c41e3a"/>

    <!-- Belt -->
    <rect x="-50" y="45" width="100" height="12" fill="#2C3E50"/>
    <rect x="-15" y="43" width="30" height="16" rx="3" fill="#FFD700"/>

    <!-- Arms -->
    <ellipse cx="-45" cy="20" rx="18" ry="40" fill="#c41e3a" transform="rotate(-20 -45 20)"/>
    <ellipse cx="45" cy="20" rx="18" ry="40" fill="#c41e3a" transform="rotate(20 45 20)"/>

    <!-- Hands waving -->
    <circle cx="-55" cy="0" r="12" fill="#fcc6a3"/>
    <circle cx="55" cy="0" r="12" fill="#fcc6a3"/>

    <!-- Head -->
    <circle cx="0" cy="-30" r="32" fill="#fcc6a3"/>

    <!-- Hat -->
    <path d="M -25,-45 L -30,-70 L 20,-68 L 25,-45 Z" fill="#c41e3a"/>
    <ellipse cx="-5" cy="-45" rx="30" ry="8" fill="#fff"/>
    <circle cx="22" cy="-69" r="7" fill="#fff"/>

    <!-- Beard -->
    <ellipse cx="0" cy="-15" rx="28" ry="22" fill="#fff"/>
    <ellipse cx="0" cy="-5" rx="25" ry="18" fill="#fff"/>

    <!-- Eyes -->
    <circle cx="-10" cy="-35" r="3" fill="#2C3E50"/>
    <circle cx="10" cy="-35" r="3" fill="#2C3E50"/>

    <!-- Nose -->
    <ellipse cx="0" cy="-25" rx="5" ry="6" fill="#ff6b6b"/>

    <!-- Buttons -->
    <circle cx="0" cy="15" r="5" fill="#2C3E50"/>
    <circle cx="0" cy="30" r="5" fill="#2C3E50"/>
  </g>

  <!-- Stars -->
  <text x="50" y="50" font-size="25" fill="#FFD700" opacity="0.8">★</text>
  <text x="320" y="70" font-size="20" fill="#FFD700" opacity="0.7">★</text>
  <text x="100" y="240" font-size="22" fill="#FFD700" opacity="0.6">★</text>
  <text x="330" y="220" font-size="18" fill="#FFD700" opacity="0.8">★</text>
</svg>
