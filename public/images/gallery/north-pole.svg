<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Night sky -->
  <rect width="400" height="300" fill="#0a1628"/>

  <!-- Aurora Borealis -->
  <path d="M 0,80 Q 100,60 200,80 T 400,80" stroke="#4ade80" stroke-width="20" fill="none" opacity="0.3"/>
  <path d="M 0,100 Q 100,85 200,100 T 400,100" stroke="#22d3ee" stroke-width="15" fill="none" opacity="0.4"/>
  <path d="M 0,120 Q 100,105 200,115 T 400,120" stroke="#a78bfa" stroke-width="18" fill="none" opacity="0.3"/>

  <!-- Snow ground -->
  <ellipse cx="200" cy="280" rx="300" ry="40" fill="#e0f2fe"/>
  <ellipse cx="200" cy="270" rx="280" ry="35" fill="#f0f9ff"/>

  <!-- Workshop -->
  <g transform="translate(150, 180)">
    <!-- Main building -->
    <rect x="0" y="0" width="100" height="70" fill="#7f1d1d"/>
    <polygon points="0,0 50,-30 100,0" fill="#991b1b"/>

    <!-- Windows with light -->
    <rect x="15" y="20" width="20" height="25" fill="#fef3c7"/>
    <rect x="65" y="20" width="20" height="25" fill="#fef3c7"/>

    <!-- Door -->
    <rect x="40" y="35" width="20" height="35" rx="10" fill="#422006"/>

    <!-- Chimney with smoke -->
    <rect x="70" y="-20" width="15" height="25" fill="#7f1d1d"/>
    <circle cx="77" cy="-25" r="8" fill="#cbd5e1" opacity="0.6"/>
    <circle cx="80" cy="-35" r="10" fill="#cbd5e1" opacity="0.5"/>
    <circle cx="75" cy="-45" r="9" fill="#cbd5e1" opacity="0.4"/>
  </g>

  <!-- North Pole sign -->
  <g transform="translate(280, 190)">
    <rect x="-3" y="0" width="6" height="80" fill="#7f1d1d" stroke="#991b1b" stroke-width="2"/>
    <rect x="-35" y="15" width="70" height="30" rx="5" fill="#fef3c7" stroke="#422006" stroke-width="2"/>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">NORTH</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">POLE</text>
  </g>

  <!-- Stars -->
  <circle cx="50" cy="30" r="2" fill="#fff"/>
  <circle cx="120" cy="50" r="1.5" fill="#fff"/>
  <circle cx="300" cy="40" r="2" fill="#fff"/>
  <circle cx="350" cy="60" r="1.5" fill="#fff"/>
  <circle cx="180" cy="25" r="1" fill="#fff"/>
  <circle cx="250" cy="35" r="1.5" fill="#fff"/>
  <circle cx="90" cy="70" r="1" fill="#fff"/>

  <!-- Falling snow -->
  <text x="80" y="140" font-size="18" fill="white" opacity="0.8">❅</text>
  <text x="220" y="160" font-size="15" fill="white" opacity="0.7">❆</text>
  <text x="340" y="150" font-size="20" fill="white" opacity="0.6">❅</text>
</svg>
