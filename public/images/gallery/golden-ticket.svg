<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="400" height="300" fill="#1a1a2e"/>

  <!-- Glow effect -->
  <circle cx="200" cy="150" r="140" fill="#ffd700" opacity="0.15"/>
  <circle cx="200" cy="150" r="100" fill="#ffd700" opacity="0.1"/>

  <!-- Golden ticket -->
  <g transform="translate(200, 150)">
    <!-- Ticket shadow -->
    <rect x="-92" y="48" width="184" height="124" rx="8" fill="#000" opacity="0.3"/>

    <!-- Main ticket body -->
    <rect x="-95" y="45" width="190" height="130" rx="8" fill="#ffd700"/>

    <!-- Decorative border -->
    <rect x="-88" y="-38" width="176" height="116" rx="5" fill="none" stroke="#b8860b" stroke-width="3"/>

    <!-- Inner border pattern -->
    <rect x="-85" y="-35" width="170" height="110" rx="5" fill="none" stroke="#daa520" stroke-width="1" stroke-dasharray="5,3"/>

    <!-- Ticket text -->
    <text x="0" y="-10" font-family="serif" font-size="24" font-weight="bold" fill="#8b4513" text-anchor="middle">THE POLAR</text>
    <text x="0" y="15" font-family="serif" font-size="24" font-weight="bold" fill="#8b4513" text-anchor="middle">EXPRESS</text>

    <!-- Decorative line -->
    <line x1="-60" y1="25" x2="60" y2="25" stroke="#b8860b" stroke-width="2"/>

    <!-- Details -->
    <text x="0" y="45" font-family="serif" font-size="14" fill="#8b4513" text-anchor="middle">GOLDEN TICKET</text>
    <text x="0" y="62" font-family="serif" font-size="10" fill="#8b4513" text-anchor="middle">ADMIT ONE</text>

    <!-- Decorative corners -->
    <circle cx="-75" cy="-25" r="4" fill="#b8860b"/>
    <circle cx="75" cy="-25" r="4" fill="#b8860b"/>
    <circle cx="-75" cy="65" r="4" fill="#b8860b"/>
    <circle cx="75" cy="65" r="4" fill="#b8860b"/>

    <!-- Serial number -->
    <text x="0" y="-50" font-family="monospace" font-size="8" fill="#b8860b" text-anchor="middle">No. 2025-12345</text>
  </g>

  <!-- Sparkles -->
  <g fill="#ffd700" opacity="0.7">
    <circle cx="100" cy="80" r="3"/>
    <circle cx="300" cy="100" r="2.5"/>
    <circle cx="120" cy="220" r="2"/>
    <circle cx="320" cy="200" r="3"/>
    <text x="80" y="130" font-size="20">✨</text>
    <text x="310" y="160" font-size="25">✨</text>
    <text x="150" y="90" font-size="18">✨</text>
    <text x="270" y="230" font-size="22">✨</text>
  </g>

  <!-- Shine effect -->
  <path d="M 150,80 L 165,95 L 150,110" stroke="#fff" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 250,170 L 265,185 L 250,200" stroke="#fff" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
