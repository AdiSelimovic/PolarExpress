<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#1a2332"/>

  <!-- Snow ground -->
  <ellipse cx="200" cy="280" rx="250" ry="30" fill="#e8f4f8" opacity="0.9"/>

  <!-- Stars -->
  <circle cx="50" cy="30" r="2" fill="#fff"/>
  <circle cx="120" cy="50" r="1.5" fill="#fff"/>
  <circle cx="280" cy="40" r="2" fill="#fff"/>
  <circle cx="350" cy="60" r="1.5" fill="#fff"/>
  <circle cx="180" cy="25" r="1" fill="#fff"/>

  <!-- Train -->
  <g transform="translate(100, 150)">
    <!-- Train body -->
    <rect x="0" y="20" width="180" height="70" rx="5" fill="#8B0000" stroke="#5a0000" stroke-width="2"/>

    <!-- Windows -->
    <rect x="15" y="30" width="30" height="25" rx="2" fill="#FFE4B5" opacity="0.8"/>
    <rect x="55" y="30" width="30" height="25" rx="2" fill="#FFE4B5" opacity="0.8"/>
    <rect x="95" y="30" width="30" height="25" rx="2" fill="#FFE4B5" opacity="0.8"/>
    <rect x="135" y="30" width="30" height="25" rx="2" fill="#FFE4B5" opacity="0.8"/>

    <!-- Gold trim -->
    <rect x="0" y="65" width="180" height="5" fill="#FFD700"/>

    <!-- Wheels -->
    <circle cx="30" cy="95" r="12" fill="#2C3E50" stroke="#FFD700" stroke-width="2"/>
    <circle cx="30" cy="95" r="5" fill="#FFD700"/>
    <circle cx="70" cy="95" r="12" fill="#2C3E50" stroke="#FFD700" stroke-width="2"/>
    <circle cx="70" cy="95" r="5" fill="#FFD700"/>
    <circle cx="110" cy="95" r="12" fill="#2C3E50" stroke="#FFD700" stroke-width="2"/>
    <circle cx="110" cy="95" r="5" fill="#FFD700"/>
    <circle cx="150" cy="95" r="12" fill="#2C3E50" stroke="#FFD700" stroke-width="2"/>
    <circle cx="150" cy="95" r="5" fill="#FFD700"/>

    <!-- Smokestack -->
    <rect x="10" y="5" width="15" height="20" fill="#2C3E50"/>
    <ellipse cx="17.5" cy="5" rx="8" ry="3" fill="#2C3E50"/>

    <!-- Smoke -->
    <circle cx="17" cy="-5" r="6" fill="#95a5a6" opacity="0.6"/>
    <circle cx="20" cy="-12" r="8" fill="#95a5a6" opacity="0.5"/>
    <circle cx="15" cy="-20" r="7" fill="#95a5a6" opacity="0.4"/>
  </g>

  <!-- Snow particles -->
  <text x="30" y="100" font-size="20" fill="white" opacity="0.7">❅</text>
  <text x="300" y="130" font-size="25" fill="white" opacity="0.6">❆</text>
  <text x="180" y="80" font-size="18" fill="white" opacity="0.8">❅</text>
  <text x="340" y="150" font-size="22" fill="white" opacity="0.7">❅</text>
</svg>
