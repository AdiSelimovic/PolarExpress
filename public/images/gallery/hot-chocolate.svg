<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - cozy interior -->
  <rect width="400" height="300" fill="#3d2817"/>

  <!-- Window with snow outside -->
  <rect x="30" y="30" width="100" height="120" rx="5" fill="#1e3a5f"/>
  <rect x="35" y="35" width="90" height="110" rx="3" fill="#89CFF0" opacity="0.3"/>
  <line x1="80" y1="35" x2="80" y2="145" stroke="#2c5f7f" stroke-width="3"/>
  <line x1="35" y1="90" x2="125" y2="90" stroke="#2c5f7f" stroke-width="3"/>

  <!-- Snowflakes outside window -->
  <text x="50" y="70" font-size="20" fill="white" opacity="0.8">❅</text>
  <text x="95" y="120" font-size="18" fill="white" opacity="0.7">❆</text>

  <!-- Table -->
  <rect x="180" y="200" width="180" height="15" rx="5" fill="#654321"/>

  <!-- Mug -->
  <g transform="translate(240, 140)">
    <!-- Mug body -->
    <rect x="0" y="30" width="80" height="70" rx="8" fill="#c41e3a"/>

    <!-- Rim -->
    <ellipse cx="40" cy="30" rx="40" ry="8" fill="#a01728"/>

    <!-- Handle -->
    <path d="M 80,50 Q 105,50 105,70 Q 105,90 80,90"
          stroke="#c41e3a" stroke-width="8" fill="none"/>

    <!-- Hot chocolate -->
    <ellipse cx="40" cy="32" rx="35" ry="6" fill="#6b4423"/>

    <!-- Whipped cream -->
    <ellipse cx="40" cy="28" rx="30" ry="12" fill="#fff"/>
    <circle cx="25" cy="22" r="8" fill="#fff"/>
    <circle cx="40" cy="18" r="10" fill="#fff"/>
    <circle cx="55" cy="22" r="8" fill="#fff"/>

    <!-- Chocolate drizzle -->
    <path d="M 25,22 Q 30,28 35,30" stroke="#6b4423" stroke-width="2" fill="none"/>
    <path d="M 45,18 Q 45,25 40,32" stroke="#6b4423" stroke-width="2" fill="none"/>

    <!-- Steam -->
    <path d="M 25,15 Q 20,5 25,-5" stroke="#cbd5e1" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 40,10 Q 35,0 40,-10" stroke="#cbd5e1" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 55,15 Q 60,5 55,-5" stroke="#cbd5e1" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Cookies on plate -->
  <g transform="translate(160, 180)">
    <ellipse cx="30" cy="30" rx="35" ry="8" fill="#d4a574"/>
    <circle cx="20" cy="25" r="12" fill="#8B4513"/>
    <circle cx="40" cy="25" r="12" fill="#8B4513"/>
    <!-- Chocolate chips -->
    <circle cx="18" cy="23" r="2" fill="#3d2817"/>
    <circle cx="23" cy="26" r="1.5" fill="#3d2817"/>
    <circle cx="38" cy="24" r="2" fill="#3d2817"/>
    <circle cx="43" cy="27" r="1.5" fill="#3d2817"/>
  </g>

  <!-- Warm glow -->
  <circle cx="270" cy="170" r="80" fill="#ff8c42" opacity="0.1"/>
</svg>
